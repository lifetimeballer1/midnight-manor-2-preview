name: Midnight Manor II Command & Control Preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'overlay/**'
      - '.github/workflows/preview.yml'
  push:
    branches: [main]
    paths:
      - 'overlay/**'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable
  SOURCE_SHA: 1e51468d492bd047bf434ae65aba09fe5efcfb42

jobs:
  verify-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview staging files
        uses: actions/checkout@v4
        with:
          path: staging

      - name: Checkout audited Midnight Manor II source
        run: |
          git clone https://github.com/lifetimeballer1/midnight-manor-2.git source
          cd source
          git checkout "$SOURCE_SHA"
          echo "Command & Control base: $(git rev-parse HEAD)"

      - name: Apply Command & Control overlay
        run: |
          rsync -a staging/overlay/ source/

      - name: Download Godot headless + export templates
        run: |
          set -eux
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          wget -q "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /usr/local/bin/godot
          wget -q "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          unzip -q templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/
          godot --version

      - name: Import project
        working-directory: source
        run: godot --headless --editor --import --path .

      - name: Verify assets
        working-directory: source
        run: python3 scripts/verify_assets.py

      - name: Run Python tests
        working-directory: source
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q

      - name: Run gameplay regression suites
        working-directory: source
        run: |
          godot --headless --path . --script res://tests/test_village.gd -- --no-save
          godot --headless --path . --script res://tests/test_game_scene.gd -- --no-save
          godot --headless --path . --script res://tests/test_workers_defense.gd -- --no-save
          godot --headless --path . --script res://tests/test_living_village.gd -- --no-save
          godot --headless --path . --script res://tests/test_update2_scene.gd -- --no-save
          godot --headless --path . --script res://tests/test_chronicle.gd -- --no-save
          godot --headless --path . --script res://tests/test_command_control.gd -- --no-save

      - name: Export Web
        working-directory: source
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll

      - name: Guard Safari compatibility
        working-directory: source
        run: |
          grep -q 'variant/thread_support=false' export_presets.cfg             || (echo "FAIL: preview must stay single-threaded for Safari" && exit 1)
          grep -q 'GODOT_THREADS_ENABLED = false' build/web/index.html             || (echo "FAIL: exported preview has threads enabled" && exit 1)
          echo "Safari guard PASS: single-threaded preview build"

      - name: Publish compiled preview to main
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" preview
          rsync -a --delete             --exclude='.git/'             --exclude='.github/'             --exclude='README.md'             --exclude='overlay/'             source/build/web/ preview/
          cd preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Preview already current."
          else
            git commit -m "Publish Command & Control preview build"
            git push origin main
          fi
